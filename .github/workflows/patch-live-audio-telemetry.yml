name: Patch live audio telemetry
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[live-audio-patched]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch live telemetry to sound engine
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/driveapex/MainActivity.kt')
          s = main.read_text()
          old = '''            telemetryReceiver.latest()?.let(::applyTelemetry) ?: showNoVehicleData()'''
          new = '''            telemetryReceiver.latest()?.let { live ->
                applyTelemetry(live)
                controller.apply(live.data)
                val motorSpeed = live.data.rpm.coerceIn(0f, 25000f).roundToInt()
                rpmValue.text = "${motorSpeed} MOTOR SPEED"
                motorSpeedBar.progress = motorSpeed
            } ?: showNoVehicleData()'''
          if old not in s:
              raise SystemExit('live poller target not found')
          s = s.replace(old, new, 1)
          main.write_text(s)

          controller = Path('app/src/main/java/com/driveapex/audio/EngineSoundController.kt')
          s = controller.read_text()
          if 'conditioned.rpm.coerceIn(700f, 7000f)' not in s:
              raise SystemExit('controller clamp target not found')
          s = s.replace('conditioned.rpm.coerceIn(700f, 7000f)', 'conditioned.rpm.coerceIn(0f, 25000f)', 1)
          controller.write_text(s)

          engine = Path('app/src/main/java/com/driveapex/audio/LayeredSoundEngine.kt')
          s = engine.read_text()
          if 'rpm = value.coerceIn(700f, 7_000f)' not in s:
              raise SystemExit('engine clamp target not found')
          s = s.replace('rpm = value.coerceIn(700f, 7_000f)', 'rpm = value.coerceIn(0f, 25_000f)', 1)
          engine.write_text(s)

          profile = Path('app/src/main/java/com/driveapex/audio/ETronInspiredSoundProfile.kt')
          s = profile.read_text()
          replacements = {
            '"motor_core", 700f, 7000f': '"motor_core", 700f, 25000f',
            '"motor_harmonic", 1000f, 7000f': '"motor_harmonic", 1000f, 25000f',
            '"electric_whine", 1800f, 7000f': '"electric_whine", 1800f, 25000f',
            '"inverter_tone", 2200f, 7000f': '"inverter_tone", 2200f, 25000f',
            '"low_body", 700f, 4200f': '"low_body", 700f, 25000f',
            '"rotor_body", 800f, 6000f': '"rotor_body", 800f, 25000f',
            '"load_pulse", 1200f, 7000f': '"load_pulse", 1200f, 25000f',
            '"sport_presence", 2500f, 7000f': '"sport_presence", 2500f, 25000f',
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit(f'profile target not found: {a}')
              s = s.replace(a,b,1)
          profile.write_text(s)

          apex = Path('app/src/main/java/com/driveapex/audio/ApexSoundProfile.kt')
          s = apex.read_text()
          replacements = {
            '"apex_motor", 700f, 7000f': '"apex_motor", 700f, 25000f',
            '"apex_harmonic", 1200f, 7000f': '"apex_harmonic", 1200f, 25000f',
            '"apex_inverter", 1800f, 7000f': '"apex_inverter", 1800f, 25000f',
            '"apex_high_whine", 3200f, 7000f': '"apex_high_whine", 3200f, 25000f',
            '"apex_low_body", 700f, 4600f': '"apex_low_body", 700f, 25000f',
            '"apex_accel_presence", 2200f, 7000f': '"apex_accel_presence", 2200f, 25000f',
            '"apex_regen", 900f, 4500f': '"apex_regen", 900f, 25000f',
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit(f'apex target not found: {a}')
              s = s.replace(a,b,1)
          apex.write_text(s)

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text().replace('?: 82', '?: 83').replace('?: "0.2.82"', '?: "0.2.83"')
          gradle.write_text(s)

          publish = Path('.github/workflows/publish-latest.yml')
          s = publish.read_text().replace('DRIVEAPEX_VERSION_CODE: 82', 'DRIVEAPEX_VERSION_CODE: 83').replace('DRIVEAPEX_VERSION_NAME: 0.2.82', 'DRIVEAPEX_VERSION_NAME: 0.2.83')
          publish.write_text(s)

          wf = Path('.github/workflows/patch-live-audio-telemetry.yml')
          wf.unlink()

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/driveapex/MainActivity.kt \
            app/src/main/java/com/driveapex/audio/EngineSoundController.kt \
            app/src/main/java/com/driveapex/audio/LayeredSoundEngine.kt \
            app/src/main/java/com/driveapex/audio/ETronInspiredSoundProfile.kt \
            app/src/main/java/com/driveapex/audio/ApexSoundProfile.kt \
            app/build.gradle.kts \
            .github/workflows/publish-latest.yml \
            .github/workflows/patch-live-audio-telemetry.yml
          git commit -m "fix: drive live telemetry into sound and motor speed [live-audio-patched]"
          git push
