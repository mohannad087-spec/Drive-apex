name: One-shot sound UI patch

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sound-ui-patched]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sound, motor-speed UI and channel
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/driveapex/MainActivity.kt')
          s = main.read_text()
          s = s.replace('private lateinit var rpmBar: SeekBar', 'private lateinit var motorSpeedBar: SeekBar')
          s = s.replace('rpmBar = seek(6300, 200)', 'motorSpeedBar = seek(25000, 0)')
          s = s.replace('root.addView(controlCard("RPM", rpmBar), margin(8))', 'root.addView(controlCard("MOTOR SPEED", motorSpeedBar), margin(8))')
          s = s.replace('rpmBar.setOnSeekBarChangeListener(listener)', 'motorSpeedBar.setOnSeekBarChangeListener(listener)')
          s = s.replace('rpmBar.isEnabled = false', 'motorSpeedBar.isEnabled = false')
          s = s.replace('rpmValue = label("700 RPM", 58f', 'rpmValue = label("0 MOTOR SPEED", 58f')
          s = s.replace('box.addView(label("RPM", 11f, MUTED, true)', 'box.addView(label("MOTOR SPEED / RPM", 11f, MUTED, true)')
          s = s.replace('telemetryReceiver.latest()?.let(::applyTelemetry) ?: showNoVehicleData()', 'telemetryReceiver.latest()?.let(::applyTelemetry) ?: showNoVehicleData()')
          main.write_text(s)

          od = Path('app/src/main/java/com/driveapex/vehicle/OverdriveTelemetryReader.kt')
          s = od.read_text()
          old = '''            val frontRpm = front?.let { abs(it).takeIf { value -> value.isFinite() && value in 0.0..25000.0 } }\n            val rearRpm = rear?.let { abs(it).takeIf { value -> value.isFinite() && value in 0.0..25000.0 } }\n            val engineRpm = engine?.let { abs(it).takeIf { value -> value.isFinite() && value in 0.0..25000.0 } }\n            val rpm = frontRpm ?: rearRpm ?: engineRpm'''
          new = '''            val frontRpm = front?.let { abs(it).takeIf { value -> value.isFinite() && value in 0.0..25000.0 && (speed == null || speed <= 1.0 || value > 0.0) } }\n            val rearRpm = rear?.let { abs(it).takeIf { value -> value.isFinite() && value in 0.0..25000.0 && (speed == null || speed <= 1.0 || value > 0.0) } }\n            val engineRpm = engine?.let { abs(it).takeIf { value -> value.isFinite() && value in 0.0..25000.0 && (speed == null || speed <= 1.0 || value > 0.0) } }\n            val rpm = frontRpm ?: rearRpm ?: engineRpm'''
          if old not in s: raise SystemExit('Overdrive RPM block not found')
          od.write_text(s.replace(old, new))

          audio = Path('app/src/main/java/com/driveapex/audio/LayeredSoundEngine.kt')
          s = audio.read_text()
          s = s.replace('private const val', 'private const val')
          s = s.replace('AudioAttributes.Builder()\n                    .setUsage(AudioAttributes.USAGE_ASSISTANCE_NAVIGATION_GUIDANCE)\n                    .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)', 'AudioAttributes.Builder()\n                    .setUsage(AudioAttributes.USAGE_ASSISTANCE_NAVIGATION_GUIDANCE)\n                    .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)')
          s = s.replace('val baseCyclesPerSecond = (currentRpm / 60.0).coerceAtLeast(11.666)', 'val baseCyclesPerSecond = (currentRpm / 60.0).coerceAtLeast(1.0)')
          s = s.replace('val rpm = conditioned.rpm.coerceIn(700f, 7000f)', 'val rpm = conditioned.rpm.coerceIn(0f, 25000f)') if False else s
          audio.write_text(s)

          Path('.github/workflows/one-shot-sound-ui-patch.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/driveapex/MainActivity.kt app/src/main/java/com/driveapex/vehicle/OverdriveTelemetryReader.kt app/src/main/java/com/driveapex/audio/LayeredSoundEngine.kt .github/workflows/one-shot-sound-ui-patch.yml
          git commit -m "fix: motor speed display and live sound [sound-ui-patched]"
          git push
