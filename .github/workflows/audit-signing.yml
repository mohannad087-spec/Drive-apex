name: Audit DriveApex release signing

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4.0.1

      - name: Download published APKs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --connect-timeout 10 --max-time 120 \
            -o /tmp/DriveApex-0.2.54.apk \
            https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.2.54/DriveApex.apk
          curl -fsSL --retry 5 --connect-timeout 10 --max-time 120 \
            -o /tmp/DriveApex-0.2.55.apk \
            https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.2.55/DriveApex.apk
          test -s /tmp/DriveApex-0.2.54.apk
          test -s /tmp/DriveApex-0.2.55.apk

      - name: Compare APK signing certificates
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DriveApex 0.2.54 ==='
          apksigner verify --verbose --print-certs /tmp/DriveApex-0.2.54.apk
          echo '=== DriveApex 0.2.55 ==='
          apksigner verify --verbose --print-certs /tmp/DriveApex-0.2.55.apk
          echo '=== SHA-256 certificate comparison ==='
          apksigner verify --print-certs /tmp/DriveApex-0.2.54.apk 2>&1 | grep 'Signer #1 certificate SHA-256 digest:' || true
          apksigner verify --print-certs /tmp/DriveApex-0.2.55.apk 2>&1 | grep 'Signer #1 certificate SHA-256 digest:' || true
