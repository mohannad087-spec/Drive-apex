name: Publish DriveApex Latest

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRIVEAPEX_KEYSTORE_HEX: ${{ secrets.DRIVEAPEX_KEYSTORE_HEX }}
      DRIVEAPEX_KEYSTORE_PASSWORD: ${{ secrets.DRIVEAPEX_KEYSTORE_PASSWORD }}
      DRIVEAPEX_KEY_ALIAS: ${{ secrets.DRIVEAPEX_KEY_ALIAS }}
      DRIVEAPEX_KEY_PASSWORD: ${{ secrets.DRIVEAPEX_KEY_PASSWORD }}
      DRIVEAPEX_VERSION_CODE: ${{ github.run_number }}
      DRIVEAPEX_VERSION_NAME: 0.2.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check signing configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRIVEAPEX_KEYSTORE_HEX" || -z "$DRIVEAPEX_KEYSTORE_PASSWORD" || -z "$DRIVEAPEX_KEY_ALIAS" || -z "$DRIVEAPEX_KEY_PASSWORD" ]]; then
            echo "ERROR: Stable release signing is not configured."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '8.9'

      - name: Restore and validate signing keystore
        shell: bash
        env:
          DRIVEAPEX_KEYSTORE_PATH: ${{ runner.temp }}/driveapex-release.jks
        run: |
          set -euo pipefail
          HEX=$(printf '%s' "$DRIVEAPEX_KEYSTORE_HEX" | tr -d '[:space:]')
          if [[ ! "$HEX" =~ ^[0-9A-Fa-f]+$ ]]; then
            echo "ERROR: DRIVEAPEX_KEYSTORE_HEX contains a non-hex character."
            exit 1
          fi
          if (( ${#HEX} % 2 != 0 )); then
            echo "ERROR: DRIVEAPEX_KEYSTORE_HEX has an odd number of hex characters."
            exit 1
          fi
          printf '%s' "$HEX" | xxd -r -p > "$DRIVEAPEX_KEYSTORE_PATH"
          test -s "$DRIVEAPEX_KEYSTORE_PATH" || { echo "ERROR: decoded keystore is empty."; exit 1; }
          keytool -list -keystore "$DRIVEAPEX_KEYSTORE_PATH" -storepass "$DRIVEAPEX_KEYSTORE_PASSWORD" -alias "$DRIVEAPEX_KEY_ALIAS" >/dev/null || {
            echo "ERROR: keystore restored, but password or alias does not match the keystore."
            exit 1
          }
          echo "DRIVEAPEX_KEYSTORE_PATH=$DRIVEAPEX_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Create deterministic update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          TAG="v${DRIVEAPEX_VERSION_NAME}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DriveApex.apk"
          test -s "$APK" || { echo "ERROR: release APK was not produced."; exit 1; }
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          cat > DriveApex-update.json <<EOF
          {
            "versionCode": ${DRIVEAPEX_VERSION_CODE},
            "versionName": "${DRIVEAPEX_VERSION_NAME}",
            "assetName": "DriveApex.apk",
            "tag": "${TAG}",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}"
          }
          EOF
          python3 -m json.tool DriveApex-update.json >/dev/null
          echo "Prepared update manifest for versionCode=${DRIVEAPEX_VERSION_CODE}, tag=${TAG}"

      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          TAG="v${DRIVEAPEX_VERSION_NAME}"
          NOTES="DriveApex latest build\nversionCode: ${DRIVEAPEX_VERSION_CODE}\nversionName: ${DRIVEAPEX_VERSION_NAME}\ncommit: ${GITHUB_SHA}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; repairing/verifying its assets."
          else
            gh release create "$TAG" \
              --title "DriveApex ${DRIVEAPEX_VERSION_NAME}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi

          gh release upload "$TAG" \
            "$APK#DriveApex.apk" \
            "DriveApex-update.json#DriveApex-update.json" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'DriveApex.apk'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'DriveApex-update.json'
          echo "Verified release assets are attached to $TAG."

      - name: Verify production update channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${DRIVEAPEX_VERSION_NAME}"
          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/DriveApex-update.json"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DriveApex.apk"

          ok=0
          for attempt in {1..10}; do
            if curl -fsSL --retry 2 --connect-timeout 5 --max-time 20 "$MANIFEST_URL" -o /tmp/DriveApex-update.json; then
              ok=1
              break
            fi
            echo "Update manifest not visible yet (attempt $attempt/10); retrying..."
            sleep 3
          done
          [[ "$ok" == "1" ]] || { echo "ERROR: latest update manifest is not reachable."; exit 1; }

          python3 - <<'PY'
          import json
          with open('/tmp/DriveApex-update.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('versionCode', 0) > 0
          assert data.get('versionName')
          assert data.get('assetName') == 'DriveApex.apk'
          assert data.get('tag', '').startswith('v')
          apk_url = data.get('apkUrl', '')
          assert apk_url.startswith('https://github.com/mohannad087-spec/Drive-apex/releases/download/')
          assert apk_url.endswith('/DriveApex.apk')
          sha = data.get('sha256', '')
          assert len(sha) == 64 and all(c in '0123456789abcdef' for c in sha.lower())
          assert data['tag'] == 'v' + data['versionName']
          print('Verified update manifest:', data['versionName'], data['versionCode'], data['apkUrl'])
          PY

          curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 5 --max-time 60 "$APK_URL" -o /dev/null
          echo "Verified version-pinned DriveApex.apk is reachable: $APK_URL"
