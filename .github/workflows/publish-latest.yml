name: Publish DriveApex Latest

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRIVEAPEX_KEYSTORE_HEX: ${{ secrets.DRIVEAPEX_KEYSTORE_HEX }}
      DRIVEAPEX_KEYSTORE_PASSWORD: ${{ secrets.DRIVEAPEX_KEYSTORE_PASSWORD }}
      DRIVEAPEX_KEY_ALIAS: ${{ secrets.DRIVEAPEX_KEY_ALIAS }}
      DRIVEAPEX_KEY_PASSWORD: ${{ secrets.DRIVEAPEX_KEY_PASSWORD }}
      DRIVEAPEX_VERSION_CODE: 65
      DRIVEAPEX_VERSION_NAME: 0.2.65

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for v in DRIVEAPEX_KEYSTORE_HEX DRIVEAPEX_KEYSTORE_PASSWORD DRIVEAPEX_KEY_ALIAS DRIVEAPEX_KEY_PASSWORD; do
            [[ -n "${!v}" ]] || { echo "ERROR: $v is not configured."; exit 1; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '8.9'

      - name: Restore and validate signing keystore
        shell: bash
        env:
          DRIVEAPEX_KEYSTORE_PATH: ${{ runner.temp }}/driveapex-release.jks
        run: |
          set -euo pipefail
          HEX=$(printf '%s' "$DRIVEAPEX_KEYSTORE_HEX" | tr -d '[:space:]')
          [[ "$HEX" =~ ^[0-9A-Fa-f]+$ ]] || { echo "ERROR: invalid keystore hex."; exit 1; }
          (( ${#HEX} % 2 == 0 )) || { echo "ERROR: keystore hex length is odd."; exit 1; }
          printf '%s' "$HEX" | xxd -r -p > "$DRIVEAPEX_KEYSTORE_PATH"
          test -s "$DRIVEAPEX_KEYSTORE_PATH"
          keytool -list -keystore "$DRIVEAPEX_KEYSTORE_PATH" -storepass "$DRIVEAPEX_KEYSTORE_PASSWORD" -alias "$DRIVEAPEX_KEY_ALIAS" >/dev/null
          echo "DRIVEAPEX_KEYSTORE_PATH=$DRIVEAPEX_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK signing
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare deterministic update assets
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          TAG="v${DRIVEAPEX_VERSION_NAME}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DriveApex.apk"
          test -s "$APK_SOURCE"
          SHA256=$(sha256sum "$APK_SOURCE" | awk '{print $1}')
          cat > DriveApex-update.json <<EOF
          {
            "versionCode": ${DRIVEAPEX_VERSION_CODE},
            "versionName": "${DRIVEAPEX_VERSION_NAME}",
            "assetName": "DriveApex.apk",
            "tag": "${TAG}",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}"
          }
          EOF
          python3 -m json.tool DriveApex-update.json >/dev/null
          cp "$APK_SOURCE" DriveApex.apk
          test -s DriveApex.apk

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${DRIVEAPEX_VERSION_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."
          else
            gh release create "$TAG" \
              --title "DriveApex ${DRIVEAPEX_VERSION_NAME}" \
              --notes "DriveApex cockpit UI for BYD Yuan Plus 2023\nversionCode: ${DRIVEAPEX_VERSION_CODE}\nversionName: ${DRIVEAPEX_VERSION_NAME}\ncommit: ${GITHUB_SHA}" \
              --target "$GITHUB_SHA" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" DriveApex.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" DriveApex-update.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"

      - name: Verify production update channel
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${DRIVEAPEX_VERSION_NAME}"
          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DriveApex-update.json"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DriveApex.apk"
          for attempt in {1..12}; do
            if curl -fsSL --retry 2 --connect-timeout 5 --max-time 20 "$MANIFEST_URL" -o /tmp/DriveApex-update.json; then break; fi
            [[ "$attempt" == "12" ]] && { echo "ERROR: manifest is not reachable."; exit 1; }
            sleep 5
          done
          python3 - <<'PY'
          import json
          with open('/tmp/DriveApex-update.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d['versionCode'] == 65
          assert d['versionName'] == '0.2.65'
          assert d['assetName'] == 'DriveApex.apk'
          assert d['tag'] == 'v0.2.65'
          assert len(d['sha256']) == 64
          print('Verified update manifest:', d['versionName'], d['versionCode'])
          PY
          curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 5 --max-time 90 "$APK_URL" -o /dev/null
          echo "Verified DriveApex.apk is reachable from $TAG."