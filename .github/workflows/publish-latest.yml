name: Publish DriveApex Latest

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRIVEAPEX_KEYSTORE_BASE64: ${{ secrets.DRIVEAPEX_KEYSTORE_BASE64 }}
      DRIVEAPEX_KEYSTORE_PASSWORD: ${{ secrets.DRIVEAPEX_KEYSTORE_PASSWORD }}
      DRIVEAPEX_KEY_ALIAS: ${{ secrets.DRIVEAPEX_KEY_ALIAS }}
      DRIVEAPEX_KEY_PASSWORD: ${{ secrets.DRIVEAPEX_KEY_PASSWORD }}
      DRIVEAPEX_VERSION_CODE: ${{ github.run_number }}
      DRIVEAPEX_VERSION_NAME: 0.2.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$DRIVEAPEX_KEYSTORE_BASE64" && -n "$DRIVEAPEX_KEYSTORE_PASSWORD" && -n "$DRIVEAPEX_KEY_ALIAS" && -n "$DRIVEAPEX_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Stable release signing is not configured yet; keeping this publish workflow idle."
          fi

      - name: Set up JDK 17
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        env:
          DRIVEAPEX_KEYSTORE_PATH: ${{ runner.temp }}/driveapex-release.jks
        run: |
          printf '%s' "$DRIVEAPEX_KEYSTORE_BASE64" | base64 --decode > "$DRIVEAPEX_KEYSTORE_PATH"
          echo "DRIVEAPEX_KEYSTORE_PATH=$DRIVEAPEX_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        run: gradle assembleRelease --stacktrace

      - name: Publish latest release
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          NOTES="DriveApex latest build\nversionCode: ${DRIVEAPEX_VERSION_CODE}\nversionName: ${DRIVEAPEX_VERSION_NAME}\ncommit: ${GITHUB_SHA}"
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest "$APK#DriveApex.apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --title "DriveApex Latest" --notes "$NOTES" --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest "$APK#DriveApex.apk" --title "DriveApex Latest" --notes "$NOTES" --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          fi
