name: Publish DriveApex Latest

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRIVEAPEX_KEYSTORE_BASE64: ${{ secrets.DRIVEAPEX_KEYSTORE_BASE64 }}
      DRIVEAPEX_KEYSTORE_PASSWORD: ${{ secrets.DRIVEAPEX_KEYSTORE_PASSWORD }}
      DRIVEAPEX_KEY_ALIAS: ${{ secrets.DRIVEAPEX_KEY_ALIAS }}
      DRIVEAPEX_KEY_PASSWORD: ${{ secrets.DRIVEAPEX_KEY_PASSWORD }}
      DRIVEAPEX_VERSION_CODE: ${{ github.run_number }}
      DRIVEAPEX_VERSION_NAME: 0.2.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing configuration
        shell: bash
        run: |
          if [[ -z "$DRIVEAPEX_KEYSTORE_BASE64" || -z "$DRIVEAPEX_KEYSTORE_PASSWORD" || -z "$DRIVEAPEX_KEY_ALIAS" || -z "$DRIVEAPEX_KEY_PASSWORD" ]]; then
            echo "ERROR: Stable release signing is not configured. Add the four DRIVEAPEX_* repository secrets before publishing releases."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and validate signing keystore
        shell: bash
        env:
          DRIVEAPEX_KEYSTORE_PATH: ${{ runner.temp }}/driveapex-release.jks
        run: |
          set -euo pipefail
          # Ignore whitespace and accidental non-base64 formatting in the pasted secret.
          printf '%s' "$DRIVEAPEX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode --ignore-garbage > "$DRIVEAPEX_KEYSTORE_PATH"

          test -s "$DRIVEAPEX_KEYSTORE_PATH" || {
            echo "ERROR: decoded keystore is empty."
            exit 1
          }

          keytool -list \
            -keystore "$DRIVEAPEX_KEYSTORE_PATH" \
            -storepass "$DRIVEAPEX_KEYSTORE_PASSWORD" \
            -alias "$DRIVEAPEX_KEY_ALIAS" >/dev/null || {
              echo "ERROR: keystore decoded, but password or alias does not match the keystore."
              exit 1
            }

          echo "DRIVEAPEX_KEYSTORE_PATH=$DRIVEAPEX_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Publish latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: release APK was not produced."; exit 1; }
          NOTES="DriveApex latest build\nversionCode: ${DRIVEAPEX_VERSION_CODE}\nversionName: ${DRIVEAPEX_VERSION_NAME}\ncommit: ${GITHUB_SHA}"
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest "$APK#DriveApex.apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --title "DriveApex Latest" --notes "$NOTES" --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest "$APK#DriveApex.apk" --title "DriveApex Latest" --notes "$NOTES" --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          fi
