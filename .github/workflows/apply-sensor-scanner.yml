name: Verify BYD sensor scanner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    if: ${{ github.event.head_commit.message != 'fix: correct daemon listener invocation' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch daemon listener invocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/driveapex/vehicle/BydLiveTelemetryDaemonMain.java')
          s = p.read_text()
          old = 'boolean listenerRegistered = engine.registerDiPlusEngineListener(snapshot);'
          new = 'boolean listenerRegistered = registerDiPlusEngineListener(engine, snapshot);'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('patched')
          else:
              print('already patched')
          PY
          if ! git diff --quiet -- app/src/main/java/com/driveapex/vehicle/BydLiveTelemetryDaemonMain.java; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/driveapex/vehicle/BydLiveTelemetryDaemonMain.java
            git commit -m 'fix: correct daemon listener invocation'
            git push
            exit 0
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: latest
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: '8.9'
      - name: Compile scanner-enabled app
        run: gradle assembleDebug --stacktrace
      - name: Verify scanner sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SCAN_PORT = 18766' app/src/main/java/com/driveapex/vehicle/BydLiveTelemetryDaemonMain.java
          grep -q 'serveScan' app/src/main/java/com/driveapex/vehicle/BydLiveTelemetryDaemonMain.java
          grep -q '127.0.0.1", 18766' app/src/main/java/com/driveapex/vehicle/BydTelemetryDiagnostics.kt
          echo "Read-only BYD scanner is wired to the live daemon."
